[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrack-dip"
version = "0.1.0"
description = "MedTrack — pipeline xử lý ảnh đơn thuốc / phiếu xét nghiệm (đồ án DIP + BTL ML)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthetic = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
