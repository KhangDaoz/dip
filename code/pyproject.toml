[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrack-dip"
version = "0.1.0"
description = "Trích xuất thông tin đơn thuốc VAIPE — đồ án Xử lý ảnh số (DIP)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
