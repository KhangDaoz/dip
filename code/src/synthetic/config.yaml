# Cấu hình sinh bộ 5 — team/KeHoach.md mục 8.2
seed: 42
source: 1                     # ảnh sạch lấy từ bộ 1 (VAIPE)
split: {train: 0.6, val: 0.1, test: 0.3}   # chia theo ẢNH GỐC

degradations:
  perspective: {levels: [0.05, 0.10, 0.20]}          # tỉ lệ dịch góc theo cạnh
